name: Python CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q tdl tests run.py
      - name: Test
        run: python -m unittest discover -v

  source-package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build source package
        run: |
          python -m pip install build
          python -m build --sdist --wheel
      - uses: actions/upload-artifact@v4
        with:
          name: tdl-python-package
          path: dist/

  gui-package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: windows-latest
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GUI and packaging dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build GUI
        run: pyinstaller --clean --noconfirm packaging/tdl-gui.spec
      - name: Archive Linux GUI
        if: runner.os == 'Linux'
        run: tar -czf tdl-gui-${{ matrix.platform }}.tar.gz -C dist tdl-gui
      - name: Archive Windows GUI
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/tdl-gui -DestinationPath tdl-gui-${{ matrix.platform }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: tdl-gui-${{ matrix.platform }}
          path: |
            tdl-gui-*.tar.gz
            tdl-gui-*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [source-package, gui-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: tdl-*
          merge-multiple: true
      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
