[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tdl"
version = "0.2.0"
description = "TIDAL Hi-Res downloader with PKCE authentication and Qt6 GUI"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7",
  "requests>=2.32",
  "pycryptodome>=3.20",
]

[project.scripts]
tdl = "tdl.__main__:main"

[tool.setuptools.packages.find]
include = ["tdl*"]
